{% load static %}
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}PyForge{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'forge_web/forge.css' %}">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="{% static 'forge_web/forge.js' %}" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="brand">Py<span>Forge</span></p>
        <nav class="nav">
          <a href="/" {% if request.path == "/" %}aria-current="page"{% endif %}>台账</a>
          <a href="/weeks/" {% if request.path == "/weeks/" %}aria-current="page"{% endif %}>weeks</a>
          <a href="/path/" {% if "/path/" in request.path or "/lessons/" in request.path %}aria-current="page"{% endif %}>编排</a>
          <a href="/gates/" {% if request.path == "/gates/" %}aria-current="page"{% endif %}>门禁</a>
        </nav>
      </div>
      <div class="pills">
        <span class="pill">open {{ open_count|default:0 }}</span>
        <span class="pill">req {{ request_count|default:0 }}</span>
      </div>
    </header>
    {% block body %}{% endblock %}
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>
