<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>PyForge weeks</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <h1>weeks</h1>
  <form method="get" action="/weeks/" hx-get="/weeks/" hx-target="#rows" hx-swap="innerHTML">
    <p><label>filter tag <input name="tag" value="{{ tag }}" placeholder="gil"></label>
    <button type="submit">filter</button></p>
  </form>
  <form method="post" action="/sessions/new/" hx-post="/sessions/new/" hx-target="#rows" hx-swap="innerHTML">
    {% csrf_token %}
    <p><label>slice_id {{ form.slice_id }}</label></p>
    <p><label>tags {{ form.tags_text }}</label></p>
    <p><button type="submit">create</button></p>
  </form>
  <table>
    <thead><tr><th>slice</th><th>tags</th></tr></thead>
    <tbody id="rows">{% include "forge_web/weeks_rows.html" %}</tbody>
  </table>
</body>
</html>
